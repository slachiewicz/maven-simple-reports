# Everything is grouped so a quiet week produces one PR per ecosystem rather
# than a dozen. The SPA's runtime dependencies (react, react-dom) are split out
# from the rest: they are the only two that can change what visitors run, so
# they deserve to be looked at on their own rather than buried in a toolchain
# bump.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      spa-runtime:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      spa-toolchain:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /netlify
    schedule:
      interval: weekly
    groups:
      netlify-functions:
        patterns: ['*']
